project.ext._mod_jar = "renameJar"

gradle.projectsEvaluated {
    tasks.named('renameJar').configure {
        output.set(tasks.named('jar', Jar).flatMap { it.archiveFile })
    }
}
afterEvaluate {
	tasks.register('preserveOriginalJar', Copy) {
        from tasks.named('jar', Jar).flatMap { it.archiveFile }
        into layout.buildDirectory.dir('libs')
        rename { it.replace('.jar', '-dev.jar') }
        dependsOn tasks.named('jar')
    }
    tasks.named('renameJar').configure {
        output.set(tasks.named('jar', Jar).flatMap { it.archiveFile })
    }

    tasks.named('renameJar').configure {
        dependsOn 'preserveOriginalJar'
    }
	// Replace the default jar in the java component with renameJar
    configurations.apiElements.outgoing.artifacts.clear()
    configurations.runtimeElements.outgoing.artifacts.clear()
    configurations.apiElements.outgoing.artifact(tasks.named(project._mod_jar))
    configurations.runtimeElements.outgoing.artifact(tasks.named(project._mod_jar))
}
//mixin {
//    add sourceSets.main, "${_mod_id}.refmap.json"
//    config "${_mod_id}.mixins.json"
//}

minecraft {
    mappings channel: mappingsChannel, version: mappingsVersion
    accessTransformers = files("src/main/resources/META-INF/accesstransformer.dev")
    runs {
        configureEach {
            workingDir = layout.projectDirectory.dir('run')

            systemProperty 'eventbus.api.strictRuntimeChecks', 'true'
            systemProperty 'forge.enabledGameTestNamespaces', 'examplemod'
			args "--mixin.config=${_mod_id}.mixins.json"
        }

        register('client') {
        	workingDir = layout.projectDirectory.dir("run/${project._loader}-Client")
        }

        register('server') {
        	workingDir = layout.projectDirectory.dir("run/${project._loader}-Server")
            args '--nogui'
        }

        register('gameTestServer')

        register('data') {
            workingDir = layout.projectDirectory.dir('run-data')

            args '--mod', 'examplemod', '--all', '--output', layout.projectDirectory.dir('src/generated/resources'), '--existing', layout.projectDirectory.dir('src/main/resources')
        }
    }
}

jar {
    manifest {
        attributes([
            "Specification-Title": _mod_name,
            "Specification-Vendor": "Stereowalker",
            "Specification-Version": "1",
            "Implementation-Title": project.name,
            "Implementation-Version": "${version}",
            "Implementation-Vendor" :"Stereowalker",
            "MixinConfigs": _mod_id+".mixins.json",
            "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

eclipse {
    synchronizationTasks 'genEclipseRuns'
}

sourceSets.main.resources { srcDir 'src/generated/resources' }
