plugins {
	id 'java'
	id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[7.0.17,8)'
    id "me.modmuss50.mod-publish-plugin" version "0.7.4"
	id "com.modrinth.minotaur" version "2.+"
    id 'net.minecraftforge.renamer' version '1.1.2'
}
apply from: "main.gradle"
apply plugin: 'net.minecraftforge.gradle'
// Only edit below this line, the above code adds and enables the necessary things for Forge to be setup.
apply plugin: 'eclipse'
apply plugin: 'maven-publish'

renamer.enableMixinRefmaps {
	config "${_mod_id}.mixins.json"
	source (sourceSets.main) {
		refMap = _mod_name+"-refmap.json"
	}
	jar(tasks.named('jar'))
}
renamer.classes(tasks.named('jar', Jar)) {
    archiveClassifier = 'srg'
    mappings renamer.mixin.generatedMappings
}

// Should exist on all loaders and is loader specific
repositories {
maven fg.forgeMaven
	mavenLocal()
	minecraft.mavenizer(it) // In Kotlin, it = this
    maven fg.minecraftLibsMaven
    mavenCentral()
	maven {url "https://modmaven.dev/" }// UnionLib
	maven {url "https://girafi.dk/maven/"}
	maven {url "https://www.cursemaven.com"} //CurseForge
    maven {url = "https://repo.spongepowered.org/maven"} // mixin
}

dependencies {
	implementation minecraft.dependency("net.minecraftforge:forge:${_minecraft_version}-${_loader_version}")
	annotationProcessor "org.spongepowered:mixin:"+modMixinVersion+":processor"

	implementation renamer.dependency("com.stereowalker.unionlib:UnionLib:${_minecraft_version}-${_unionlib_version}-${_loader}")

	compileOnly ("mezz.jei:jei-${_minecraft_version}-common-api:${_jei_version}")
	compileOnly ("mezz.jei:jei-${_minecraft_version}-forge-api:${_jei_version}")
	compileOnly ("com.stereowalker.combat:C.O.M.B.A.T:1.18.2"+/*_minecraft_version+*/"-"+combatVersion+":api")
    //compileOnly ("top.theillusivec4.caelus:caelus-forge:"+_minecraft_version+"-"+caelusVersion+"")
    //compileOnly ("vazkii.patchouli:Patchouli:${_minecraft_version}-${patchouliVersion}-FORGE:api")

	implementation renamer.dependency("mezz.jei:jei-${_minecraft_version}-forge:${_jei_version}")
	//runtimeOnly ("top.theillusivec4.caelus:caelus-forge:"+_minecraft_version+"-"+caelusVersion+"")
    //runtimeOnly ("vazkii.patchouli:Patchouli:${_minecraft_version}-${patchouliVersion}-FORGE")

    implementation renamer.dependency("com.github.glitchfiend:GlitchCore-forge:${_minecraft_version}-0.0.1.1")
    implementation ("com.github.glitchfiend:TerraBlender-forge:${_minecraft_version}-3.0.1.10")
    implementation ("com.github.glitchfiend:SereneSeasons-forge:${_minecraft_version}-${_serene_seasons_version}")
    implementation ("com.github.glitchfiend:BiomesOPlenty-forge:${_minecraft_version}-${_bop_version}")
    implementation renamer.dependency("curse.maven:pneumaticcraft-repressurized-281849:4843223")
	//implementation ("curse.maven:origins-474438:"+originsID)
	//implementation ("curse.maven:create-328085:"+createID)
	//implementation ("curse.maven:flywheel-486392:"+flywheelID)
}
renamer.mappings(minecraft.dependency.toSrg)

task apiJar(type: Jar) {
    from(sourceSets.main.allJava) {
        include 'com/stereowalker/survive/api/**'
    }
    from (sourceSets.main.output) {
        include 'com/stereowalker/survive/api/**'
    }
	archiveClassifier = 'api'
}
artifacts {
	archives apiJar
}
