plugins {
	id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.0.145'
    id "com.matthewprenger.cursegradle" version "1.4.0"
	id "com.modrinth.minotaur" version "2.+"
}

version = _minecraft_version + "-" +modVersion+"-"+modLoader
group = modGroup
archivesBaseName = _mod_name

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

println('Java: ' + System.getProperty('java.version') + ' JVM: ' + System.getProperty('java.vm.version') + '(' + System.getProperty('java.vendor') + ') Arch: ' + System.getProperty('os.arch'))
println('Mod Name: ' + _mod_name + ', Mod Version: ' + modVersion + ', Minecraft Version: ' + _minecraft_version + ', '+modLoader+' Version: ' + _loader_version)


tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

minecraft {
  accessTransformers {
    file('src/main/resources/META-INF/accesstransformer.cfg')
  }
}

runs {
    configureEach {
        systemProperty 'forge.logging.markers', 'REGISTRIES'
        systemProperty 'forge.logging.console.level', 'debug'
        modSource project.sourceSets.main
    }
    client {
        systemProperty 'forge.enabledGameTestNamespaces', project._mod_id
        workingDirectory project.file('run/Neo-Client')
    }
    server {
        systemProperty 'forge.enabledGameTestNamespaces', project._mod_id
        workingDirectory project.file('run/Neo-Server')
        programArgument '--nogui'
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

repositories {
	//maven {url = "https://dvs1.progwml6.com/files/maven/"}// JEI
	maven {url "https://modmaven.dev/" }// UnionLib
	maven {url = "https://maven.theillusivec4.top/"}
	maven {url 'https://maven.blamejared.com'}
	maven {url "https://www.cursemaven.com"}
    maven {url = "https://repo.spongepowered.org/maven"} // mixin
    maven {url "https://maven.shedaniel.me/"} // cloth config
}

dependencies {
	implementation "net.neoforged:neoforge:${_loader_version}"
	implementation fileTree(include: ['*.jar'], dir: 'libs')
	implementation ("com.stereowalker.unionlib:UnionLib:"+_minecraft_version+"-"+unionLibVersion+"-"+modLoader+"")
	
	compileOnly ("mezz.jei:jei-${_minecraft_version}-common-api:"+jeiVersion)
	compileOnly ("mezz.jei:jei-${_minecraft_version}-neoforge-api:"+jeiVersion)
	compileOnly ("com.stereowalker.combat:C.O.M.B.A.T:1.18.2"+/*_minecraft_version+*/"-"+combatVersion+":api")
    //compileOnly ("top.theillusivec4.caelus:caelus-forge:"+_minecraft_version+"-"+caelusVersion+"")
    //compileOnly ("vazkii.patchouli:Patchouli:${_minecraft_version}-${patchouliVersion}-FORGE:api")
	
	implementation ("mezz.jei:jei-${_minecraft_version}-neoforge:"+jeiVersion+"")
	//runtimeOnly ("top.theillusivec4.caelus:caelus-forge:"+_minecraft_version+"-"+caelusVersion+"")
    //runtimeOnly ("vazkii.patchouli:Patchouli:${_minecraft_version}-${patchouliVersion}-FORGE")
	
    implementation ("com.github.glitchfiend:GlitchCore-neoforge:${_minecraft_version}-2.0.0.2")
    implementation ("com.github.glitchfiend:TerraBlender-neoforge:${_minecraft_version}-4.0.0.1")
    implementation ("com.github.glitchfiend:SereneSeasons-neoforge:${_minecraft_version}-${_serene_seasons_version}")
    implementation ("com.github.glitchfiend:BiomesOPlenty-neoforge:${_minecraft_version}-${_bop_version}")
	//implementation ("curse.maven:origins-474438:"+originsID)
	//implementation ("curse.maven:create-328085:"+createID)
	//implementation ("curse.maven:flywheel-486392:"+flywheelID)
}

// Example for how to get properties into the manifest for reading by the runtime..
jar {
    manifest {
        attributes([
            "Specification-Title": _mod_name,
            "Specification-Vendor": "Stereowalker",
            "Specification-Version": "1",
            "Implementation-Title": project.name,
            "Implementation-Version": "${version}",
            "Implementation-Vendor" :"Stereowalker",
            "MixinConfigs": _mod_id+".mixins.json",
            "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

task sourcesJar(type: Jar) {
    from sourceSets.main.allJava
    from (sourceSets.main.output) {
        include 'LICENSE.txt'
    }

    archiveClassifier = 'sources'
}

task deobfJar(type: Jar) {
	from sourceSets.main.output
	archiveClassifier = "deobf"
}


task apiJar(type: Jar) {
    from(sourceSets.main.allJava) {
        include 'com/stereowalker/survive/api/**'
    }
    from (sourceSets.main.output) {
        include 'com/stereowalker/survive/api/**'
    }
	archiveClassifier = 'api'
}

curseforge {
    project {
    	id = modCurseId
		apiKey = "$System.env.CURSEFORGEKEY"
		changelog = file('changelog.md')
		changelogType = "markdown"
		releaseType = 'release'
		addGameVersion(_minecraft_version)
        addGameVersion("${project.modLoader}")
		relations {
      		requiredDependency 'unionlib'
		}	
		mainArtifact(jar) {
			displayName = _mod_name+"-$project.version"
		}
		addArtifact sourcesJar
	}
	options {
    	debug = false // defaults to false
  	}		
}


modrinth {
    token = "$System.env.MODRINTH_TOKEN"
    projectId = _mod_id
    versionNumber = "${project.version}"
    versionType = "release"
    uploadFile = jar
    gameVersions = [_minecraft_version]
    loaders = ["${project.modLoader}".toLowerCase()]
	changelog = file('changelog.md').text
    dependencies {
        required.project "unionlib"
    }
}
task uploadToAllSites {
    uploadToAllSites.dependsOn curseforge
    uploadToAllSites.dependsOn modrinth
    uploadToAllSites.dependsOn publish
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: _minecraft_version, //minecraft_version_range: minecraft_version_range,
            //forge_version: _loader_version, forge_version_range: forge_version_range,
            loader_version_range: "[${_loader_version_min},"+_loader_version_max+")",
            mod_id: _mod_id, mod_name: _mod_name, mod_license: _mod_license, mod_version: modVersion,
            mod_authors: _mod_authors, mod_description: _mod_description,
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties/* + [project: project]*/
    }
}

// Example configuration to allow publishing using the maven-publish task
// we define a custom artifact that is sourced from the reobfJar output task
// and then declare that to be published
// Note you'll need to add a repository here
//def reobfFile = file("$buildDir/reobfJar/output.jar")
//def reobfArtifact = artifacts.add('default', reobfFile) {
//    type 'jar'
//    builtBy 'reobfJar'
//}
//jar.finalizedBy('reobfJar')
publishing {
    publications {
        mavenJava(MavenPublication) {
        	afterEvaluate {
                artifact project.jar
                artifact project.apiJar
                artifact project.sourcesJar
            }
        
        	groupId = project.group
			artifactId = project.archivesBaseName
			version = project.version
        }
    }
    repositories {
        maven {
            name = "modmaven"
			credentials {
				username "$System.env.ARTIFACTORYUSER"
				password "$System.env.ARTIFACTORYPASS"
			}
			url = "https://modmaven.dev/artifactory/local-releases/"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

artifacts {
	archives sourcesJar
	archives deobfJar
	archives apiJar
}
